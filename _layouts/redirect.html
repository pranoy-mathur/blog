<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting</title>
  <link rel="canonical" href="{{ page.redirect_to | absolute_url }}">
  <meta http-equiv="refresh" content="0; url={{ page.redirect_to | relative_url }}">
  <meta name="robots" content="noindex">
  <script>location.replace("{{ page.redirect_to | relative_url }}");</script>
</head>
<body>
  <p><a href="{{ page.redirect_to | relative_url }}">Continue to {{ page.redirect_to | absolute_url }}</a></p>
</body>
</html>
