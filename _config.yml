# These Jekyll settings are required by Github Pages
lsi: false
incremental: false
highlighter: rouge
gist:
  noscript: false
kramdown:
  math_engine: mathjax
  syntax_highlighter: rouge

title: Pranoy Mathur
url: "https://pranoymathur.com"
baseurl: ""
author:
  name: Pranoy Mathur
  email: pranoy.mathur@gmail.com

description: research and ruminations

remote_theme: jekyll/minima@93b1921

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-remote-theme

# Top navigation, in this order. Six items is the agreed ceiling.
# The label is each page's nav_title (or its title if nav_title is not set).
header_pages:
  - index.md
  - research.md
  - social-impact.md
  - mun.md
  - beyond.md
  - about.md

show_excerpts: true

# Structured project pages. A file at _projects/research/acrb.md is served
# at /research/acrb/ and listed on the Research & Internships page.
collections:
  projects:
    output: true
    permalink: /:path/

defaults:
  - scope:
      path: "_projects/research"
      type: projects
    values:
      layout: project
      section: research
      nav_parent: /research/
  - scope:
      path: "_projects/social-impact"
      type: projects
    values:
      layout: project
      section: social-impact
      nav_parent: /social-impact/

minima:
  skin: solarized-light
  social_links:
    - { platform: instagram, user_url: "https://www.instagram.com/a.amr_campaign" }
