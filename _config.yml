# These Jekyll settings are required by Github Pages
lsi: false
incremental: false
highlighter: rouge
gist:
  noscript: false
kramdown:
  math_engine: mathjax
  syntax_highlighter: rouge

title: Pranoy Mathur
url: "https://pranoymathur.com"
baseurl: ""
author:
  name: Pranoy Mathur
  email: pranoy.mathur@gmail.com

remote_theme: jekyll/minima@93b1921

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-remote-theme

show_excerpts: true

# Dashed boxes marking content you still have to write. false hides them all
# (use this on the live site); true shows them while you are filling things in.
show_placeholders: false

collections:
  # The homepage sections, in the order set by each file's `order:`.
  # They also make the top navigation. Six is the agreed ceiling.
  sections:
    output: false
  # Structured project pages. A file at _projects/research/acrb.md is served
  # at /research/acrb/ and listed in the "In the lab" section.
  projects:
    output: true
    permalink: /:path/

defaults:
  - scope:
      path: "_projects/research"
      type: projects
    values:
      layout: project
      section: research
  - scope:
      path: "_projects/social-impact"
      type: projects
    values:
      layout: project
      section: social-impact

minima:
  skin: solarized-light
